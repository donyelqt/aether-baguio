[project]
name = "simulation"
version = "0.1.0"
description = "AETHER: Baguio — deterministic simulation engine and realtime gateway"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "shapely==2.1.2",
  "orjson==3.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.168.3",
  "httpx==0.28.1",
  "pytest-benchmark==5.3.0",
  "mypy==2.4.0",
  "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# `pythonpath` keeps `app` importable without an editable install, so
# `python -m pytest` works in a bare checkout as well as under `uv run`.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "perf: tick-budget and bandwidth gates (nightly, not per-commit)",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app/engine", "app/wire", "app/ai"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]